<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Certified Generative AI Developer - Professional 問題集</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img class="brand-badge" src="assets/aip-badge.png" alt="AWS Certified Generative AI Developer - Professional badge">
      <div class="brand-text">
        <strong>AWS Certified Generative AI Developer</strong>
        <span data-i18n="topbar.subtitle">Professional (AIP-C01) 問題集</span>
      </div>
    </div>
    <div id="timerBox" class="timer-box hidden">
      <span class="timer-label" data-i18n="timer.label">残り時間</span>
      <span id="timerValue" class="timer-value">180:00</span>
    </div>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
    <button id="quitBtn" class="btn btn-ghost hidden" data-i18n="quit.button">中断してホームへ</button>
  </div>
</header>

<main id="app" class="app"></main>

<template id="tpl-home">
  <section class="home">
    <div class="stock-banner">
      <div>
        <span id="stockLine"></span>
      </div>
      <div class="domain-chips" id="domainChips"></div>
    </div>

    <div class="ai-panel">
      <div class="ai-block">
        <h3 data-i18n="home.aiWeak.title">🤖 AIコーチ: 苦手問題を復習</h3>
        <p data-i18n="home.aiWeak.desc"></p>
        <button id="weakFocusBtn" class="btn btn-primary" data-i18n="home.aiWeak.button">苦手問題を復習する</button>
        <span id="weakFocusStatus" class="ai-status"></span>
      </div>
      <div class="ai-block">
        <h3 data-i18n="home.aiAnalyze.title">🤖 AIコーチ: 弱点分析</h3>
        <p data-i18n="home.aiAnalyze.desc"></p>
        <button id="analyzeBtn" class="btn btn-ghost" data-i18n="home.aiAnalyze.button">これまでの回答から弱点を分析する</button>
        <div id="analyzeResult" class="ai-result hidden"></div>
      </div>
    </div>

    <div class="mode-grid">
      <article class="mode-card">
        <h2 data-i18n="home.random.title">ランダム 200問</h2>
        <p data-i18n="home.random.desc"></p>
        <button class="btn btn-primary" data-mode="random200" data-i18n="home.random.start">開始する</button>
      </article>

      <article class="mode-card">
        <h2 data-i18n="home.category.title">カテゴリー別 100問</h2>
        <p data-i18n="home.category.desc"></p>
        <select id="categorySelect" class="select"></select>
        <button class="btn btn-primary" data-mode="category100" data-i18n="home.category.start">開始する</button>
      </article>

      <article class="mode-card mode-card-exam">
        <h2 data-i18n="home.mock.title">模擬試験 85問</h2>
        <p><span data-i18n="home.mock.desc1"></span><strong data-i18n="home.mock.desc2"></strong><span data-i18n="home.mock.desc3"></span></p>
        <button class="btn btn-primary" data-mode="mock85" data-i18n="home.mock.start">模擬試験を開始</button>
      </article>

      <article class="mode-card">
        <h2 data-i18n="home.flash.title">一問一答フラッシュカード</h2>
        <p data-i18n="home.flash.desc"></p>
        <button class="btn btn-primary" data-mode="flash150" data-i18n="home.flash.start">開始する</button>
      </article>
    </div>
  </section>
</template>

<template id="tpl-quiz">
  <section class="quiz">
    <aside class="quiz-nav">
      <div class="quiz-nav-header">
        <div class="quiz-nav-titles">
          <span id="quizModeLabel"></span>
          <span id="quizProgressLabel"></span>
        </div>
        <button id="navToggleBtn" class="nav-toggle-btn" type="button" aria-expanded="true" data-i18n-attr-title="quiz.navToggle">▲</button>
      </div>
      <div id="quizNavBody" class="quiz-nav-body">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <div id="qNavGrid" class="qnav-grid"></div>
        <div class="qnav-legend">
          <span><i class="dot dot-correct"></i><span data-i18n="quiz.legend.correct"></span></span>
          <span><i class="dot dot-incorrect"></i><span data-i18n="quiz.legend.incorrect"></span></span>
          <span><i class="dot dot-current"></i><span data-i18n="quiz.legend.current"></span></span>
          <span><i class="dot dot-unanswered"></i><span data-i18n="quiz.legend.unanswered"></span></span>
        </div>
      </div>
    </aside>

    <div class="quiz-main">
      <div class="qcard">
        <div class="qcard-head">
          <span id="qDomainBadge" class="badge"></span>
          <span id="qTypeBadge" class="badge badge-outline"></span>
        </div>
        <h2 id="qText" class="qtext"></h2>
        <div id="qOptions" class="qoptions"></div>
        <div id="qFeedback" class="qfeedback hidden">
          <div id="qFeedbackHead" class="qfeedback-head"></div>
          <p id="qExplanation" class="qexplanation"></p>
        </div>
      </div>

      <div class="qcard-actions">
        <button id="prevBtn" class="btn btn-ghost" data-i18n="quiz.back">戻る</button>
        <button id="submitBtn" class="btn btn-primary" data-i18n="quiz.submit">回答する</button>
        <button id="nextBtn" class="btn btn-primary hidden" data-i18n="quiz.next">次の問題へ</button>
        <button id="finishBtn" class="btn btn-primary hidden" data-i18n="quiz.finish">結果を見る</button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-flash">
  <section class="flash">
    <div class="flash-progress">
      <span id="flashProgressLabel"></span>
      <div class="progress-bar"><div id="flashProgressFill" class="progress-fill"></div></div>
    </div>
    <div class="flash-card-wrap">
      <div id="flashCard" class="flash-card">
        <div class="flash-face flash-front">
          <span id="flashDomainBadge" class="badge"></span>
          <p id="flashQuestion"></p>
          <span class="flash-hint" data-i18n="flash.hint">クリックして解答を表示</span>
        </div>
        <div class="flash-face flash-back">
          <p id="flashAnswer"></p>
          <p id="flashExplain" class="qexplanation"></p>
        </div>
      </div>
    </div>
    <div class="flash-actions">
      <button id="flashPrev" class="btn btn-ghost" data-i18n="flash.prev">前へ</button>
      <button id="flashFlip" class="btn btn-primary" data-i18n="flash.flip">裏面を見る</button>
      <button id="flashNext" class="btn btn-primary" data-i18n="flash.next">次へ</button>
    </div>
  </section>
</template>

<template id="tpl-result">
  <section class="result">
    <h2 id="resultTitle"></h2>
    <div class="result-score" id="resultScore"></div>
    <div class="result-bars" id="resultBars"></div>
    <div class="result-actions">
      <button id="reviewBtn" class="btn btn-ghost" data-i18n="result.review">解答を見直す</button>
      <button id="homeBtn" class="btn btn-primary" data-i18n="result.home">ホームに戻る</button>
    </div>
    <div id="reviewList" class="review-list hidden"></div>
  </section>
</template>

<script src="questions.js"></script>
<script src="i18n.js"></script>
<script src="flashcards.js"></script>
<script src="app.js"></script>
</body>
</html>
